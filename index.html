<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PANELS FTW — Image Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E3000B;
  --black: #0a0a0a;
  --white: #ffffff;
  --gray: #f2f2f2;
  --gray2: #e0e0e0;
  --gray3: #999;
  --text: #111;
  --text2: #666;
  --blue: #0057FF;
  --green: #16a34a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--white); color: var(--text); font-family: 'Barlow', sans-serif; }

/* ─── TOPBAR ─── */
.topbar {
  background: var(--black);
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 28px;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 200;
}
.topbar-divider { width: 1px; height: 28px; background: #333; flex-shrink: 0; }
.topbar-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  letter-spacing: 4px;
  color: var(--white);
  white-space: nowrap;
}
.topbar-title span { color: var(--red); }
.search-box { flex: 1; max-width: 340px; position: relative; }
.search-box input {
  width: 100%;
  background: #1a1a1a;
  border: 1px solid #333;
  border-radius: 2px;
  color: #fff;
  font-family: 'Barlow', sans-serif;
  font-size: 13px;
  padding: 8px 12px 8px 34px;
  outline: none;
  transition: border .2s;
}
.search-box input::placeholder { color: #555; }
.search-box input:focus { border-color: var(--red); }
.search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: #555; font-size: 13px; pointer-events: none; }
.topbar-count {
  margin-left: auto;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: 1px;
  color: #555; white-space: nowrap;
}
.topbar-count b { color: var(--red); font-size: 16px; }

/* ─── PAGE BANNER ─── */
.page-banner {
  background: var(--black);
  padding: 20px 28px 16px;
  border-bottom: 1px solid #1a1a1a;
}
.page-banner-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px; letter-spacing: 4px; color: var(--white); line-height: 1;
}
.page-banner-title span { color: var(--red); }
.page-banner-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; letter-spacing: 2px; color: #444;
  text-transform: uppercase; margin-top: 4px;
}

/* ─── FILTERS ─── */
.filters-wrap {
  background: var(--gray);
  border-bottom: 2px solid var(--red);
  padding: 12px 28px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.fl {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--gray3); align-self: center;
}
.filter-group { display: flex; gap: 4px; flex-wrap: wrap; }
.fbtn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase;
  padding: 5px 14px;
  border: 1.5px solid var(--gray2);
  border-radius: 2px;
  background: var(--white);
  color: var(--text2);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.fbtn:hover { border-color: var(--black); color: var(--black); }
.fbtn.active { background: var(--black); border-color: var(--black); color: var(--white); }
.sep { width: 1px; height: 20px; background: var(--gray2); margin: 0 4px; align-self: center; }

/* ─── GRID ─── */
.grid-wrap { padding: 20px 28px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 1px;
  background: var(--gray2);
}

/* ─── CARD ─── */
.card {
  background: var(--white);
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
  position: relative;
  overflow: hidden;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.15); z-index: 1; }
.card:hover .card-img { transform: scale(1.04); }

.card-img-wrap { overflow: hidden; aspect-ratio: 1; background: #f8f8f8; position: relative; }
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s ease; }
.card-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 4px;
  background: #f0f0f0;
}
.card-placeholder svg { width: 48px; height: auto; opacity: .12; }
.card-placeholder-txt {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 8px; font-weight: 700; letter-spacing: 1px;
  color: #ccc; text-align: center;
}

.bu-stripe { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--red); }

/* Stock badge */
.stock-badge {
  position: absolute; bottom: 8px; left: 8px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  padding: 3px 8px; border-radius: 2px;
}
.stock-badge.has { background: rgba(0,87,255,.88); color: #fff; }
.stock-badge.none { background: rgba(153,153,153,.75); color: #fff; }

/* IMG indicator dot */
.img-dot {
  position: absolute; top: 10px; right: 10px;
  width: 18px; height: 18px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 800;
}
.img-dot.ok { background: rgba(22,163,74,.85); color: #fff; }
.img-dot.nope { background: rgba(0,0,0,.35); color: #aaa; }

.card-body { padding: 12px 14px 14px; }
.card-bu-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; color: var(--white);
  padding: 2px 8px; border-radius: 2px;
  display: inline-block; margin-bottom: 8px;
  background: var(--red);
}
.card-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 700; line-height: 1.2;
  color: var(--text); margin-bottom: 3px; letter-spacing: .5px;
}
.card-art {
  font-size: 10px; color: var(--gray3); margin-bottom: 8px;
  font-family: 'Barlow', sans-serif; letter-spacing: .5px;
}
.tienda-chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.tchip {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; padding: 2px 6px; border-radius: 2px;
  background: var(--gray); color: var(--gray3); border: 1px solid var(--gray2);
  white-space: nowrap;
}
.tchip.pos { background: rgba(0,87,255,.07); color: var(--blue); border-color: rgba(0,87,255,.2); }
.tchip.neg { background: rgba(234,88,12,.07); color: #ea580c; border-color: rgba(234,88,12,.2); }

/* ─── MODAL ─── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.72); z-index: 1000;
  align-items: center; justify-content: center; padding: 20px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--white); max-width: 560px; width: 100%;
  max-height: 93vh; overflow-y: auto;
  box-shadow: 0 32px 80px rgba(0,0,0,.4);
  position: relative;
}
.modal-img-wrap { aspect-ratio: 1; background: #f5f5f5; overflow: hidden; position: relative; }
.modal-img { width: 100%; height: 100%; object-fit: cover; display: block; }
.modal-ph {
  width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #f2f2f2, #e8e8e8); gap: 10px;
}
.modal-ph svg { width: 80px; opacity: .1; }
.modal-ph-txt {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  color: #bbb; text-transform: uppercase;
}
.modal-top-stripe { height: 4px; background: var(--red); }
.modal-body { padding: 24px; }
.modal-bu-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 800; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--white);
  padding: 3px 12px; border-radius: 2px;
  display: inline-block; margin-bottom: 12px; background: var(--red);
}
.modal-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 3px; color: var(--text);
  line-height: 1; margin-bottom: 4px;
}
.modal-art {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: 1.5px;
  color: var(--gray3); text-transform: uppercase; margin-bottom: 20px;
}
.msec { margin-bottom: 20px; }
.msec-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 800; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--gray3);
  border-bottom: 1px solid var(--gray2); padding-bottom: 6px; margin-bottom: 12px;
}
.modal-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--gray2); border: 1px solid var(--gray2);
  margin-bottom: 20px; overflow: hidden; border-radius: 2px;
}
.mstat { background: var(--white); padding: 16px; text-align: center; }
.mstat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px; letter-spacing: 2px; line-height: 1;
}
.mstat-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--gray3); margin-top: 4px;
}

/* Tienda rows with bar */
.tienda-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
}
.t-name-col {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px; font-weight: 700; letter-spacing: .5px;
  text-transform: uppercase; color: var(--text);
  width: 110px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.t-bar-track { flex: 1; background: var(--gray); height: 22px; overflow: hidden; border-radius: 1px; }
.t-bar-fill { height: 100%; background: var(--blue); display: flex; align-items: center; padding: 0 7px; transition: width .9s cubic-bezier(.4,0,.2,1); }
.t-bar-fill span { font-family: 'Barlow Condensed', sans-serif; font-size: 10px; font-weight: 800; color: rgba(255,255,255,.9); white-space: nowrap; letter-spacing: .5px; }
.t-qty-col {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px; font-weight: 800; color: var(--blue);
  width: 32px; text-align: right; flex-shrink: 0;
}
.t-qty-col.neg { color: #ea580c; }

/* URL block */
.url-block {
  background: var(--gray); border: 1px solid var(--gray2);
  padding: 12px 14px; display: flex; align-items: center; gap: 10px;
  margin-top: 4px;
}
.url-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 9px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; color: var(--gray3); flex-shrink: 0;
}
.url-val {
  font-size: 10px; color: var(--blue); flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: monospace;
}
.url-val.empty { color: var(--gray3); font-style: italic; font-family: 'Barlow', sans-serif; }
.url-val a { color: inherit; text-decoration: none; }
.url-val a:hover { text-decoration: underline; }
.copy-btn {
  background: none; border: 1.5px solid var(--gray2); border-radius: 2px;
  padding: 4px 12px; cursor: pointer;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase;
  color: var(--text2); transition: all .15s; flex-shrink: 0;
}
.copy-btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }
.copy-btn.done { background: var(--green); color: var(--white); border-color: var(--green); }

.modal-close {
  position: absolute; top: 14px; right: 14px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(0,0,0,.6); color: #fff;
  border: none; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 10; transition: background .2s;
}
.modal-close:hover { background: var(--red); }

/* EMPTY */
.empty { text-align: center; padding: 80px 20px; color: var(--gray3); grid-column: 1/-1; }
.empty-icon { font-size: 40px; margin-bottom: 12px; }
.empty-txt { font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

@media(max-width:600px) {
  .topbar { padding: 0 16px; }
  .filters-wrap, .grid-wrap { padding-left: 16px; padding-right: 16px; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
}
</style>
</head>

  </div>
</div>

<!-- GRID -->
<div class="grid-wrap">

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="handleOverlayClick(event)">

    <div class="modal-top-stripe"></div>

      <div class="modal-stats">
        <div class="mstat">
          <div class="mstat-val" id="mStock" style="color:var(--blue)">0</div>
          <div class="mstat-label">STOCK TOTAL</div>
        </div>
        <div class="mstat">
          <div class="mstat-val" id="mTiendaCnt" style="color:var(--red)">0</div>
          <div class="mstat-label">TIENDAS</div>
        </div>
      </div>
      <div class="msec" id="mTiendasSec">
        <div class="msec-title">DISPONIBLE POR TIENDA</div>
        <div id="mTiendas"></div>
      </div>
      <div class="msec">
        <div class="msec-title">URL IMAGEN PLYTIX</div>
        <div class="url-block">
          <span class="url-label">URL</span>
          <span class="url-val" id="mUrl"></span>
          <button class="copy-btn" id="copyBtn" onclick="copyUrl()">COPIAR</button>
        </div>
      </div>
    </div>
  </div>
</div>

function setImgF(v) {
  fImg = v;
  ['all','yes','no'].forEach(k => document.getElementById('fi-'+k).classList.toggle('active', k===v));
  render();
}
function setStockF(v) {
  fStock = v;
  ['all','yes','no'].forEach(k => document.getElementById('fs-'+k).classList.toggle('active', k===v));
  render();
}

document.getElementById('searchInput').addEventListener('input', e => {
  fSearch = e.target.value.trim();
  render();
});

function makeCard(p) {
  const hi = hasImg(p);
  const stock = totalStock(p);

  const imgPart = hi
    ? `<img class="card-img" src="${p.imagen}" alt="${p.nombre}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
    : '';
  const phPart = `<div class="card-placeholder" style="display:${hi?'none':'flex'}">
    <svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
      <polygon points="0,60 40,0 80,60" fill="#E3000B"/>
      <polygon points="30,60 70,0 110,60" fill="#E3000B" opacity=".5"/>
      <polygon points="60,60 100,0 140,60" fill="#E3000B" opacity=".25"/>
    </svg>
    <div class="card-placeholder-txt">SIN IMAGEN</div>
  </div>`;

  const stockBadge = stock > 0
    ? `<div class="stock-badge has">📦 ${stock.toLocaleString('es-MX')} DISP.</div>`
    : `<div class="stock-badge none">SIN STOCK</div>`;

  const imgDot = hi
    ? `<div class="img-dot ok">✓</div>`
    : `<div class="img-dot nope">✗</div>`;

  const entries = Object.entries(p.tiendas || {});
  const chips = entries.slice(0, 5).map(([s, q]) => {
    const cls = q > 0 ? 'pos' : (q < 0 ? 'neg' : '');
    return `<span class="tchip ${cls}">${STORE_SHORT[s]||s.substring(0,10)}</span>`;
  }).join('');
  const more = entries.length > 5 ? `<span class="tchip">+${entries.length-5}</span>` : '';

  return `<div class="card" onclick='openModal(${JSON.stringify(JSON.stringify(p))})'>
    <div class="card-img-wrap">
      <div class="bu-stripe"></div>
      ${imgDot}
      ${imgPart}${phPart}
      ${stockBadge}
    </div>
    <div class="card-body">
      <div class="card-bu-tag">IMAGE FINDER</div>
      <div class="card-name">${p.nombre}</div>
      <div class="card-art">#${p.sku}</div>
      <div class="tienda-chips">${chips}${more}</div>
    </div>
  </div>`;
}

function render() {
  const pp = getFiltered();
  document.getElementById('countDisplay').textContent = pp.length.toLocaleString('es-MX');
  const grid = document.getElementById('mainGrid');
  if (!pp.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">◎</div><div class="empty-txt">SIN RESULTADOS</div></div>`;
    return;
  }
  grid.innerHTML = pp.map(makeCard).join('');
}

function openModal(pJson) {
  const p = JSON.parse(pJson);
  const hi = hasImg(p);

  // Image
  const mImg = document.getElementById('mImg');
  if (hi) {
    mImg.innerHTML = `<img class="modal-img" src="${p.imagen}" alt="${p.nombre}" onerror="this.parentElement.innerHTML=phHtml()">`;
  } else {
    mImg.innerHTML = phHtml();
  }

  document.getElementById('mName').textContent = p.nombre;
  document.getElementById('mArt').textContent = '#' + p.sku;

  const stock = totalStock(p);
  const entries = Object.entries(p.tiendas || {}).sort((a,b) => b[1]-a[1]);
  document.getElementById('mStock').textContent = stock.toLocaleString('es-MX');
  document.getElementById('mStock').style.color = stock > 0 ? 'var(--blue)' : 'var(--gray3)';
  document.getElementById('mTiendaCnt').textContent = entries.length;

  // Tienda bars
  const maxQ = Math.max(...entries.map(e => Math.abs(e[1])), 1);
  const barsHtml = entries.length ? entries.map(([s, q]) => {
    const pct = Math.round(Math.abs(q) / maxQ * 100);
    const short = STORE_SHORT[s] || s.substring(0, 14);
    const negCls = q < 0 ? 'neg' : '';
    return `<div class="tienda-row">
      <div class="t-name-col">${short}</div>
      <div class="t-bar-track"><div class="t-bar-fill" style="width:${pct}%"><span>${Math.abs(q)}</span></div></div>
      <div class="t-qty-col ${negCls}">${q > 0 ? '+' : ''}${q}</div>
    </div>`;
  }).join('') : `<div style="color:var(--gray3);font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:1px;padding:8px 0">SIN TIENDAS</div>`;
  document.getElementById('mTiendas').innerHTML = barsHtml;

  // URL
  currentUrl = (hi ? p.imagen : '');
  const urlEl = document.getElementById('mUrl');
  const copyBtn = document.getElementById('copyBtn');
  if (currentUrl) {
    urlEl.innerHTML = `<a href="${currentUrl}" target="_blank">${currentUrl}</a>`;
    urlEl.className = 'url-val';
    copyBtn.style.display = '';
  } else {
    urlEl.textContent = 'Sin imagen en Plytix';
    urlEl.className = 'url-val empty';
    copyBtn.style.display = 'none';
  }
  copyBtn.textContent = 'COPIAR';
  copyBtn.className = 'copy-btn';

  document.getElementById('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function phHtml() {
  return `<div class="modal-ph">
    <svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
      <polygon points="0,60 40,0 80,60" fill="#E3000B"/>
      <polygon points="30,60 70,0 110,60" fill="#E3000B" opacity=".5"/>
      <polygon points="60,60 100,0 140,60" fill="#E3000B" opacity=".25"/>
    </svg>
    <div class="modal-ph-txt">IMAGEN NO DISPONIBLE EN PLYTIX</div>
  </div>`;
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('overlay')) closeModal();
}
function closeModal() {
  document.getElementById('overlay').classList.remove('open');
  document.body.style.overflow = '';
}

function copyUrl() {
  if (!currentUrl) return;
  navigator.clipboard.writeText(currentUrl).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ COPIADO';
    btn.className = 'copy-btn done';
    setTimeout(() => { btn.textContent = 'COPIAR'; btn.className = 'copy-btn'; }, 2200);
  });
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();
</script>
</body>
</html>
